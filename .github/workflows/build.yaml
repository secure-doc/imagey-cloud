name: Java CI with Maven

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "main"

jobs:
  check-commit:
    runs-on: ubuntu-latest
    name: check conventional commit compliance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # pick the pr HEAD instead of the merge commit
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Conventional commit check
        uses: cocogitto/cocogitto-action@v3

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B clean install
    - name: Bundle
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: mvn -B -f imagey-server/pom.xml meecrowave:bundle
    - name: Upload bundle artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: imagey-server-bundle
        path: imagey-server/target/imagey-server-meecrowave-distribution.zip
        if-no-files-found: error
        retention-days: 7

  deploy:

    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Download bundle artifact
      uses: actions/download-artifact@v4
      with:
        name: imagey-server-bundle
        path: bundle
    - name: Upload bundle
      run: |
        echo "=== GitHub Runner File Check ==="
        ls -lh bundle/ || echo "Bundle folder does not exist!"

        ZIP_FILE="bundle/imagey-server-meecrowave-distribution.zip"
        if [ ! -f $ZIP_FILE ]; then
          echo "ERROR: File does not exist!"
          exit 1
        fi

        DEPLOYMENT_SECRET="${{ secrets.DEPLOYMENT_SECRET }}"

        curl --fail -X PUT \
          -H "X-Deployment-Secret: $DEPLOYMENT_SECRET" \
          -T "$ZIP_FILE" \
          https://secure-doc.store/deployments
    - name: Copy bundle
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ vars.HOST }}
        username: ${{ vars.USERNAME }}
        key: ${{ secrets.KEY }}
        source: bundle/imagey-server-meecrowave-distribution.zip
        target: ~/
        strip_components: 1
    - name: Deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ vars.HOST }}
        username: ${{ vars.USERNAME }}
        key: ${{ secrets.KEY }}
        script: |
          ~/imagey-server-distribution/bin/meecrowave.sh stop
          unzip -o ~/imagey-server-meecrowave-distribution.zip
          export SMTP_HOST=${{ vars.SMTP_HOST }}
          export SMTP_PORT=${{ vars.SMTP_PORT }}
          export SMTP_USER=${{ vars.SMTP_USER }}
          export SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          export ROOT_PATH=${{ secrets.ROOT_PATH }}
          export AUTHENTICATION_SECRET=${{ secrets.AUTHENTICATION_SECRET }}
          export USER_MAPPING_SECRET=${{ secrets.USER_MAPPING_SECRET }}
          export DOCUMENT_MAPPING_SECRET=${{ secrets.DOCUMENT_MAPPING_SECRET }}
          export PUSH_VAPID_PUBLIC_KEY=${{ secrets.PUSH_VAPID_PUBLIC_KEY }}
          export PUSH_VAPID_PRIVATE_KEY=${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          export PUSH_VAPID_SUBJECT=${{ secrets.PUSH_VAPID_SUBJECT }}
          ~/imagey-server-distribution/bin/meecrowave.sh start
