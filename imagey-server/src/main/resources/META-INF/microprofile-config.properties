# Mail texts: %1$s is the product name of the requesting domain (e.g. Imagey or Secure Doc),
# %2$s (invitation only) the inviter's address. Values are HTML-escaped; separate paragraphs with \n\n.
mail.invitation.subject=You are invited to %1$s
mail.invitation.body=<strong>%2$s</strong> invited you to %1$s, so you can share photos and chat securely.\n\n\
    Accept the invitation to create your free account. The invitation is valid for 7 days.
mail.invitation.action=Accept invitation

mail.login.subject=Sign in to %1$s
mail.login.body=Someone \u2013 hopefully you \u2013 asked to sign in to %1$s with this email address.\n\n\
    Click the button below to sign in. The link is valid for 24 hours and can only be used by you.
mail.login.action=Sign in to %1$s

mail.registration.subject=Confirm your email address for %1$s
mail.registration.body=Welcome to %1$s! Please confirm your email address to finish creating your account.\n\n\
    The link is valid for 24 hours.
mail.registration.action=Confirm email address
