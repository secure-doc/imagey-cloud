<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{subject}}</title>
<style>
  @media only screen and (max-width: 620px) {
    .container { width: 100% !important; }
    .content { padding: 28px 24px !important; }
  }
  a { color: #006bd6; }
</style>
</head>
<body style="margin:0; padding:0; background-color:#f2f4f7; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#f2f4f7;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f4f7;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <table role="presentation" class="container" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px; max-width:560px;">
        <tr>
          <td align="left" style="padding:0 4px 16px 4px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:22px; font-weight:700; letter-spacing:-0.2px; color:#006bd6;">
            {{appName}}
          </td>
        </tr>
        <tr>
          <td class="content" style="background-color:#ffffff; border-radius:12px; border:1px solid #e3e7ed; padding:36px 40px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#1f2933;">
            <h1 style="margin:0 0 20px 0; font-size:22px; line-height:30px; font-weight:600; color:#1f2933;">{{subject}}</h1>
            {{content}}
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px 0;">
              <tr>
                <td align="center" bgcolor="#006bd6" style="border-radius:8px; background-color:#006bd6;">
                  <a href="{{actionLink}}" target="_blank" style="display:inline-block; padding:13px 28px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:16px; font-weight:600; line-height:20px; color:#ffffff; text-decoration:none; border-radius:8px;">{{actionLabel}}</a>
                </td>
              </tr>
            </table>
            <p style="margin:0; padding-top:20px; border-top:1px solid #e3e7ed; font-size:13px; line-height:20px; color:#6b7785;">
              If the button does not work, copy this link into your browser:<br>
              <a href="{{actionLink}}" target="_blank" style="color:#006bd6; word-break:break-all;">{{actionLink}}</a>
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 16px 0 16px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:12px; line-height:18px; color:#8a94a1;">
            This email was sent automatically by {{appName}}. If you did not expect it, you can safely ignore it.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
