services:
  greenmail:
    image: greenmail/standalone:2.1.0
    ports:
      # SMTP
      - "${SMTP_PORT:-3025}:3025"
      # IMAP
      - "${IMAP_PORT:-3143}:3143"
      # Greenmail API (mapped to 8081 to avoid conflict with Meecrowave)
      - "${GREENMAIL_API_PORT:-8081}:8080"
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.users=test@imagey.cloud:password

  # Optional S3-compatible storage backend for local testing of storage.type=s3 (see README). Not
  # used unless the meecrowave service's MEECROWAVE_OPTS is switched to -Dstorage.type=s3 below -
  # the default storage.type is filesystem, on the "data" bind mount, same as before this existed.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    ports:
      - "${MINIO_PORT:-9000}:9000"
      # Web console, only useful when poking around manually
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"

  meecrowave:
    build: .
    ports:
      - "${MEECROWAVE_PORT:-8080}:8080"
    environment:
      - MEECROWAVE_OPTS=-Droot.path=data -Dauthentication.secret=eXkLrmpPYd11aQVgCkCGmKF8XtfpfZv02mUDPNjREcxSjcz/ZtX/u6NZbcaZhWQ3zjEbzb1dUSKVvcfjzNp45Q== -Duser.mapping.secret=local-docker-user-mapping-pepper -Ddocument.mapping.secret=local-docker-keyfile-pepper -Dsmtp.host=greenmail -Dsmtp.port=3025 -Dsmtp.user=test@imagey.cloud -Dsmtp.password=password -Dsecure-doc.urls=https://secure-doc.store,https://imagey.cloud,http://localhost:8080
      # To test against MinIO instead of the filesystem, replace the line above with:
      # - MEECROWAVE_OPTS=-Droot.path=data -Dauthentication.secret=eXkLrmpPYd11aQVgCkCGmKF8XtfpfZv02mUDPNjREcxSjcz/ZtX/u6NZbcaZhWQ3zjEbzb1dUSKVvcfjzNp45Q== -Duser.mapping.secret=local-docker-user-mapping-pepper -Ddocument.mapping.secret=local-docker-keyfile-pepper -Dsmtp.host=greenmail -Dsmtp.port=3025 -Dsmtp.user=test@imagey.cloud -Dsmtp.password=password -Dsecure-doc.urls=https://secure-doc.store,https://imagey.cloud,http://localhost:8080 -Dstorage.type=s3 -Dstorage.s3.bucket=imagey -Dstorage.s3.region=us-east-1 -Dstorage.s3.endpoint=http://minio:9000 -Dstorage.s3.path-style-access=true -Daws.accessKeyId=minioadmin -Daws.secretAccessKey=minioadmin
    depends_on:
      - greenmail
      - minio
